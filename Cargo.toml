[package]
name = "thresher"
version = "0.1.1"
edition = "2024"
authors = ["cetra3 <cetra3@hotmail.com>"]
description = "Execute a callback when a memory threshold is reached"
license = "MIT/Apache-2.0"
repository = "https://github.com/cetra3/thresher"
readme = "README.md"
keywords = ["allocator", "memory"]
categories = ["memory-management"]
# `benches/common.rs` is a shared module, not a bench target of its own
autobenches = false


[dev-dependencies]
tikv-jemallocator = { version = "0.6.0", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
jemalloc_pprof = { version = "0.8.0", features = ["symbolize"]}
tokio = { version = "1.47.1", features = ["full"] }
criterion = { version = "0.7.0", default-features = false, features = ["cargo_bench_support"] }

[features]
# Adds `thresher::install_alloc_error_hook`, which turns a hard-limit refusal
# into a catchable panic. `set_alloc_error_hook` is still unstable, so this needs
# a nightly compiler — but only for whoever enables it. Off by default, and the
# crate is stable Rust without it.
alloc-error-hook = []

[[example]]
name = "hard_limit"
required-features = ["alloc-error-hook"]

[[bench]]
name = "system"
harness = false

[[bench]]
name = "thresher"
harness = false
