name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    # macOS is not redundant here. The per-thread accounting keeps its state in a
    # thread local with a `Drop` impl, so the first allocation on every thread
    # registers a destructor — and on macOS that goes through `_tlv_atexit`,
    # which allocates, re-entering the allocator mid-initialisation. It does not
    # nest on glibc; this is what checks the claim on the platform where it is
    # least obviously true.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # Compile only: benchmark timings from shared CI runners aren't worth acting on
    - name: Build benchmarks
      run: cargo bench --no-run --verbose
