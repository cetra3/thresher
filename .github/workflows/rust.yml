name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    # Compile only: benchmark timings from shared CI runners aren't worth acting on
    - name: Build benchmarks
      run: cargo bench --no-run --verbose

  # `set_alloc_error_hook` is unstable, so the opt-in feature needs nightly.
  # The stable job above is what guarantees the default build stays stable.
  alloc-error-hook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: rustup toolchain install nightly --profile minimal
    - name: Build with the hook
      run: cargo +nightly build --features alloc-error-hook --verbose
    - name: Run the hard limit example
      run: cargo +nightly run --release --example hard_limit --features alloc-error-hook
